<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/galaxyIcon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>H O S H I</title>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QWG0NWGL66"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QWG0NWGL66');
    </script>
  </head>
  <body> 
    <div id="boot-loader" role="progressbar" aria-label="Cargando Hoshi" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="boot-grupo">
        <div class="boot-marca">H O S H I</div>
        <div class="boot-track"><span></span></div>
      </div>
    </div>
    <style>body{margin:0;background:#020305}#boot-loader{position:fixed;inset:0;z-index:9999;background:#020305;color:#b8cadb;text-align:center;font:16px system-ui;transition:opacity .6s ease}#boot-loader.fin{opacity:0;pointer-events:none}.boot-grupo{position:absolute;top:36%;left:0;right:0;display:grid;justify-items:center;transition:transform .25s ease}.boot-marca{margin-bottom:12px;font-family:'Comfortaa',-apple-system,sans-serif;font-weight:300;font-size:29.5px;letter-spacing:.15em;color:#b7c9d5;text-shadow:0 0 6px currentColor,0 0 18px currentColor}.boot-track{width:220px;height:2px;background:#20303d;margin:24px auto;overflow:hidden}.boot-track span{display:block;width:0;height:100%;background:#91bed2;box-shadow:0 0 8px #91bed255;transition:width 1.2s ease-out}</style>
    <script>
      // Pantalla de carga: solo el logo y la barra. La barra crece con el avance real
      // (window.hoshiProgreso, src/progresoCarga.js) y nunca retrocede; la pantalla se retira cuando la
      // escena avisa que todo cargó (window.hoshiCargaLista, desde App.jsx).
      (function () {
        var pantalla = document.getElementById('boot-loader'), barra = pantalla.querySelector('.boot-track span');
        var listo = false, mostrado = 0;
        function pintar(avance) {
          mostrado = Math.max(mostrado, listo ? 1 : Math.min(avance, 0.97));
          barra.style.width = 100 * mostrado + '%';
          pantalla.setAttribute('aria-valuenow', String(Math.round(100 * mostrado)));
        }
        window.hoshiProgreso = function (avance) { pintar(avance); };
        window.hoshiCargaLista = function () {
          listo = true; pintar(1);
          setTimeout(function () { pantalla.classList.add('fin'); }, 800);
          setTimeout(function () { pantalla.remove(); }, 1450);
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
